name: Release
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored during recovery)
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Validate a candidate without publishing
        type: boolean
        default: false
      resume_tag:
        description: Automated continuation tag (dispatch at this exact tag)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: chaching-release
  cancel-in-progress: false
env:
  RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
  RELEASE_DRY_RUN: ${{ inputs.dry_run || 'false' }}
  RELEASE_SCHEDULED: ${{ github.event_name == 'schedule' }}
  RELEASE_RESUME_TAG: ${{ inputs.resume_tag }}
jobs:
  prepare:
    if: inputs.resume_tag == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      ref: ${{ steps.prepare.outputs.ref }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.mode != 'noop'
        with:
          name: release-candidate
          path: candidate.json
          if-no-files-found: error
  gate:
    needs: prepare
    if: needs.prepare.outputs.mode == 'prepare' || needs.prepare.outputs.mode == 'recover'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
  promote:
    needs: [prepare, gate]
    if: needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-package
          path: artifacts
      - name: Verify evidence and promote the tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs promote
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-evidence
          path: artifacts/
          if-no-files-found: error
  publish:
    if: inputs.resume_tag != '' && github.ref == format('refs/tags/{0}', inputs.resume_tag) && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - name: Publish exact tested tarball through npm OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release.mjs publish
  outcome:
    if: always()
    needs: [prepare, gate, promote, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - name: Require a valid outcome
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PREPARE_MODE: ${{ needs.prepare.outputs.mode }}
          GATE_RESULT: ${{ needs.gate.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [ -n "$RELEASE_RESUME_TAG" ]; then
            node tools/release.mjs verify
            test "$PUBLISH_RESULT" = success
          else
            test "$PREPARE_RESULT" = success
            if [ "$PREPARE_MODE" = noop ]; then
              echo 'No unreleased app changes; no release attempted.'
            else
              test "$GATE_RESULT" = success
              test "$PROMOTE_RESULT" = success
              echo 'Candidate verified. A real release completes only in the tagged continuation.'
            fi
          fi
