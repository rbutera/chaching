name: Marketing site
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/src/**'
      - 'apps/site/public/**'
      - 'apps/site/package.json'
      - 'apps/site/vite.config.ts'
      - 'tools/marketing/pages.mjs'
      - 'tools/marketing/brand.ts'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketing-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: marketing-production
      url: https://chaching.fyi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          node: '26.7.0'
      - name: Build and validate the site
        run: |
          pnpm site:build
          node --test tools/marketing/freshness.test.mjs
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.131.1 pages deploy apps/site/dist --project-name chaching --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify the public site
        run: |
          curl --fail --retry 5 --retry-delay 5 --silent https://chaching.fyi/ | grep -q 'Quietly setting'
          curl --fail --retry 5 --retry-delay 5 --silent https://chaching.fyi/docs/ | grep -q 'Start counting'
