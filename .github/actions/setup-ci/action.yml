name: Set up chaching CI
description: Install the pinned workspace toolchain and isolated Nx cache
inputs:
  node:
    description: Node version
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node }}
        cache: pnpm
    - name: Choose cache trust scope
      id: scope
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RELEASE_CANDIDATE: ${{ github.workflow == 'Release' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      run: |
        if git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
          echo 'value=trusted' >> "$GITHUB_OUTPUT"
        elif [ "$RELEASE_CANDIDATE" = true ]; then
          echo 'value=trusted-candidate' >> "$GITHUB_OUTPUT"
        else
          echo "value=untrusted-${PR_NUMBER:-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/nx-remote-cache
        key: nx-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node }}-${{ steps.scope.outputs.value }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          nx-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node }}-${{ steps.scope.outputs.value }}-${{ hashFiles('pnpm-lock.yaml') }}-
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Start Nx cache proxy
      shell: bash
      env:
        NX_CACHE_PROXY_DIR: ${{ runner.temp }}/nx-remote-cache
      run: |
        node tools/nx-cache-proxy.mjs > "$RUNNER_TEMP/nx-cache-proxy.log" 2>&1 &
        for attempt in 1 2 3 4 5; do
          if curl --fail --silent http://127.0.0.1:4210/healthz >/dev/null; then
            echo 'NX_SELF_HOSTED_REMOTE_CACHE_SERVER=http://127.0.0.1:4210' >> "$GITHUB_ENV"
            exit 0
          fi
          sleep 1
        done
        echo '::warning::Nx cache proxy unavailable; running without remote cache'
